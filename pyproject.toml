[project]
name = "pyorbbecsdk"
version = "2.0.15"
description = "a fork build with uv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=16.0.1",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pybind11==2.12.0",
    "pybind11-global==2.12.0",
    "pybind11-stubgen>=2.5.5",
    "pygame>=2.6.1",
    "pynput>=1.8.1",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
]

[tool.cibuildwheel]
build = "cp39-* cp310-*"
archs = "AMD64"   # Options: AMD64 ARM64 x86
