[project]
name = "pyorbbecsdk"
version = "1.3.4"
description = "从 pyorbbecsdk 官方的修复 "
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=16.0.1", # for h264 decoding
    "numpy<2.0", # see https://github.com/orbbec/pyorbbecsdk/issues/47
    "open3d>=0.19.0", # for visualization point cloud
    "opencv-python>=4.11.0.86",
    "pip>=25.2",
    "plyfile>=1.1.2", # for saving point cloud
    "pybind11==2.11.0",
    "pybind11-global==2.11.0",
    "pybind11-stubgen>=2.5.5",
    "pygame>=2.6.1", # for visualization
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
]

